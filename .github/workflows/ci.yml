name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill package
        run: python tools/validate_package.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: python tools/smoke_test.py
      - name: Rescue smoke test
        run: python tools/hardening_smoke_test.py
