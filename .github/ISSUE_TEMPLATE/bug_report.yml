name: Bug report
description: Report a reproducible failure in FES (not a sensitive security vulnerability).
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or commands, with no credentials or private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, OS, coding agent and FES version
